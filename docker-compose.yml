version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./hybridrag.db:/app/hybridrag.db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: streamlit run ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - AM_I_IN_A_DOCKER_CONTAINER=true
    depends_on:
      - backend
